<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- 1. KIỂM TRA ĐĂNG NHẬP BẮT BUỘC (AUTH GUARD) -->
    <script>
        const currentUser = JSON.parse(localStorage.getItem('user'));
        const authToken = localStorage.getItem('auth_token');
        if (!currentUser || !authToken) {
            window.location.href = '/login';
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống AI Bản Đồ Nông Nghiệp</title>

    <!-- FontAwesome Icons & Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary-color: #1b5e20;
            --primary-light: #2e7d32;
            --bg-color: #f4f6f9;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        /* Top Header Bar */
        .header-bar {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-header {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-logout {
            background: #d32f2f;
            border: none;
        }

        .btn-logout:hover {
            background: #b71c1c;
        }

        /* Layout Container */
        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 53px);
            position: relative;
        }

        /* Leaflet Map */
        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }

        /* Chat Panel Sidebar */
        .chat-panel {
            width: 380px;
            background: white;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 2;
            box-shadow: -2px 0 10px rgba(0,0,0,0.05);
        }

        .chat-header {
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #e8f5e9;
            color: #1b5e20;
            border-bottom-right-radius: 2px;
        }

        .message.bot {
            align-self: flex-start;
            background: #f1f3f4;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        /* Image Preview Area */
        .image-preview-container {
            padding: 8px 15px;
            display: none;
            align-items: center;
            gap: 10px;
            background: #fafafa;
            border-top: 1px solid var(--border-color);
        }

        .image-preview-container img {
            height: 50px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .btn-remove-img {
            color: red;
            cursor: pointer;
            font-size: 14px;
        }

        /* Chat Input Box */
        .chat-input-container {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            background: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-input-container input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .btn-icon:hover {
            background: #f0f0f0;
            color: var(--primary-color);
        }

        .btn-send {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-send:hover {
            background: var(--primary-light);
        }

        /* Loading Spinner */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            font-size: 12px;
            color: #777;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <div class="header-bar">
        <div class="header-title">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Hệ Thống AI Bản Đồ Nông Nghiệp</span>
        </div>
        <div class="user-menu">
            <span><i class="fa-solid fa-circle-user"></i> Xin chào, <b id="displayUsername">User</b></span>
            
            <!-- Nút Quản trị Admin (chỉ hiển thị nếu tài khoản là Admin) -->
            <a href="/admin" id="btnAdminPage" class="btn-header" style="display: none;">
                <i class="fa-solid fa-user-shield"></i> Trang Admin
            </a>

            <button class="btn-header btn-logout" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Interactive Leaflet Map -->
        <div id="map"></div>

        <!-- AI Chatbot Sidebar -->
        <div class="chat-panel">
            <div class="chat-header">
                <i class="fa-solid fa-robot"></i> Trợ Lý AI Nông Nghiệp (Gemini)
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    Xin chào! Tôi là Trợ lý AI Bản đồ Nông nghiệp. Bạn có thể hỏi tôi về thông tin thửa đất, diện tích, thời tiết hoặc giá nông sản!
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <i class="fa-solid fa-spinner fa-spin"></i> AI đang suy nghĩ...
            </div>

            <!-- Pre-view ảnh đính kèm -->
            <div class="image-preview-container" id="imagePreviewContainer">
                <img id="imagePreview" src="" alt="Preview">
                <i class="fa-solid fa-circle-xmark btn-remove-img" onclick="removeSelectedImage()"></i>
            </div>

            <!-- Input Chat Form -->
            <div class="chat-input-container">
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                <button class="btn-icon" onclick="document.getElementById('imageInput').click()" title="Đính kèm hình ảnh">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" id="chatInput" placeholder="Nhập câu hỏi..." onkeypress="handleKeyPress(event)">
                <button class="btn-send" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let currentBase64Image = null;
        let conversationContext = [];
        const conversationStorageKey = `agri_chat_context_${currentUser ? currentUser.id : 'guest'}`;

        // 1. Hiển thị thông tin người dùng từ localStorage
        document.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                document.getElementById('displayUsername').innerText = currentUser.full_name || currentUser.username;
                if (currentUser.role === 'admin') {
                    document.getElementById('btnAdminPage').style.display = 'inline-flex';
                }
            }
            restoreConversationContext();
            initMap();
        });

        // 2. Khởi tạo Bản đồ Leaflet Map
        let map;
        let geojsonLayer;
        let lastSelectedParcelIds = [];

        function restoreConversationContext() {
            const storedContext = sessionStorage.getItem(conversationStorageKey);
            if (!storedContext) return;

            try {
                const parsedContext = JSON.parse(storedContext);
                if (!Array.isArray(parsedContext)) {
                    throw new TypeError('Lịch sử hội thoại phải là một mảng.');
                }
                conversationContext = parsedContext
                    .filter(turn =>
                        turn &&
                        (turn.role === 'user' || turn.role === 'assistant') &&
                        typeof turn.content === 'string'
                    )
                    .map(turn => ({
                        role: turn.role,
                        content: turn.content,
                        parcel_ids: Array.isArray(turn.parcel_ids)
                            ? turn.parcel_ids.filter(id => typeof id === 'string').slice(0, 20)
                            : []
                    }))
                    .slice(-12);
                if (conversationContext.length) {
                    document.getElementById('chatMessages').textContent = '';
                    conversationContext.forEach(turn => appendMessage(turn.content, turn.role === 'user' ? 'user' : 'bot'));
                    const lastAssistantTurn = [...conversationContext].reverse().find(turn => turn.role === 'assistant');
                    if (lastAssistantTurn) lastSelectedParcelIds = lastAssistantTurn.parcel_ids;
                }
            } catch (error) {
                console.error('Không thể khôi phục ngữ cảnh chat:', error);
                sessionStorage.removeItem(conversationStorageKey);
            }
        }

        function saveConversationContext() {
            conversationContext = conversationContext.slice(-12);
            sessionStorage.setItem(conversationStorageKey, JSON.stringify(conversationContext));
        }

        function getColorByCrop(type) {
            if (!type) return '#64748b';
            const cropType = type.toString().trim().toUpperCase();

            if (cropType.includes('LÚA')) return '#16a34a';
            if (cropType.includes('RAU') || cropType.includes('HOA MÀU')) return '#84cc16';
            if (cropType.includes('QUẢ') || cropType.includes('CAM') || cropType.includes('XOÀI')) return '#f97316';
            if (cropType.includes('CÀ PHÊ')) return '#8b5cf6';
            if (cropType.includes('TÔM') || cropType.includes('CÁ')) return '#06b6d4';
            return '#64748b';
        }

        async function loadGeoJSONToMap() {
            try {
                const response = await fetch('/api/parcels/geojson');
                if (!response.ok) return;

                const geojsonData = await response.json();
                if (geojsonLayer) map.removeLayer(geojsonLayer);

                geojsonLayer = L.geoJSON(geojsonData, {
                    style: function(feature) {
                        const props = feature.properties || {};
                        const cropType = props.cay_trong || props.loai_nong_san || props.loai_dat || props.loai;
                        const fillColor = getColorByCrop(cropType);
                        return {
                            color: fillColor,
                            weight: 2,
                            fillColor: fillColor,
                            fillOpacity: 0.55
                        };
                    },
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 7,
                            color: '#0f172a',
                            weight: 2,
                            fillColor: '#38bdf8',
                            fillOpacity: 0.9
                        });
                    },
                    onEachFeature: function(feature, layer) {
                        const props = feature.properties || {};
                        const rows = Object.keys(props)
                            .map(key => `<b>${key}:</b> ${props[key]}`)
                            .join('<br>');
                        layer.bindPopup(`<div style="font-size: 13px;"><b>THÔNG TIN ĐỐI TƯỢNG</b><hr style="margin: 4px 0;">${rows}</div>`);
                    }
                }).addTo(map);

                if (geojsonLayer.getBounds().isValid()) {
                    map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
                }
                highlightParcels(lastSelectedParcelIds);
            } catch (error) {
                console.error("Lỗi nạp bản đồ:", error);
            }
        }

        function highlightParcels(parcelIds) {
            if (!Array.isArray(parcelIds)) return;
            lastSelectedParcelIds = parcelIds;
            if (!geojsonLayer || parcelIds.length === 0) return;

            const selectedIds = new Set(parcelIds.map(id => String(id).trim().toLocaleLowerCase()));
            const selectedLayers = [];
            geojsonLayer.eachLayer(layer => {
                const feature = layer.feature || {};
                const properties = feature.properties || {};
                const parcelId = properties.id || properties.parcel_code || properties.ten;
                if (
                    parcelId &&
                    selectedIds.has(String(parcelId).trim().toLocaleLowerCase()) &&
                    feature.geometry &&
                    ['Polygon', 'MultiPolygon'].includes(feature.geometry.type)
                ) {
                    layer.setStyle({
                        color: '#facc15',
                        weight: 4,
                        fillColor: '#facc15',
                        fillOpacity: 0.75
                    });
                    selectedLayers.push(layer);
                } else {
                    geojsonLayer.resetStyle(layer);
                }
            });

            if (selectedLayers.length) {
                const bounds = L.featureGroup(selectedLayers).getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 18 });
                }
            }
        }

        function initMap() {
            // Tọa độ mặc định (Mặt bằng chung)
            map = L.map('map').setView([10.762622, 106.660172], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            loadGeoJSONToMap();
        }

        // 3. Xử lý đăng xuất
        function handleLogout() {
            if (confirm("Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?")) {
                localStorage.removeItem('user');
                localStorage.removeItem('auth_token');
                window.location.href = '/login';
            }
        }

        // 4. Xử lý đính kèm ảnh
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentBase64Image = e.target.result;
                    document.getElementById('imagePreview').src = currentBase64Image;
                    document.getElementById('imagePreviewContainer').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function removeSelectedImage() {
            currentBase64Image = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        // 5. Gửi tin nhắn Chat tới API FastAPI
        async function sendMessage() {
            const inputEl = document.getElementById('chatInput');
            const userText = inputEl.value.trim();

            if (!userText && !currentBase64Image) return;

            // Hiển thị tin nhắn User trên khung Chat
            appendMessage(userText || "[Hình ảnh]", 'user');
            inputEl.value = '';

            const payload = {
                message: userText || "Phân tích hình ảnh này",
                user_id: currentUser ? currentUser.id : null,
                image_base64: currentBase64Image,
                history: conversationContext.slice(-12)
            };

            // Dọn dẹp preview ảnh sau khi bấm gửi
            removeSelectedImage();

            // Hiển thị hiệu ứng loading AI
            showTyping(true);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                showTyping(false);

                if (response.ok) {
                    appendMessage(data.reply, 'bot');
                    const parcelIds = Array.isArray(data.parcel_ids) ? data.parcel_ids : [];
                    lastSelectedParcelIds = parcelIds;
                    conversationContext.push(
                        { role: 'user', content: userText || '[Hình ảnh]', parcel_ids: [] },
                        { role: 'assistant', content: data.reply, parcel_ids: parcelIds }
                    );
                    saveConversationContext();
                    highlightParcels(parcelIds);
                } else {
                    const errorMessage = data.detail || data.reply || "Yêu cầu AI thất bại.";
                    appendMessage(`Lỗi AI (${response.status}): ${errorMessage}`, 'bot');
                }
            } catch (error) {
                showTyping(false);
                console.error("Lỗi gửi chat:", error);
                appendMessage("Không thể kết nối đến server!", 'bot');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping(isTyping) {
            document.getElementById('typingIndicator').style.display = isTyping ? 'block' : 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
